[project]
name = "budget-app"
version = "0.1.0"
description = "Personal Budget API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "sqlalchemy<2.1",
    "alembic",
    "uvicorn[standard]",
    "psycopg2-binary",
    "bcrypt",
    "PyJWT",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
